name: Publish Release

on:
  push:

jobs:
  publish-release:
    runs-on: ubuntu-latest
    if: "contains(github.event.head_commit.message, '?publish_release')"

    steps:
    - uses: actions/checkout@v7
      with:
        token: ${{ secrets.TOKEN }}

    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
          target/
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.toml') }}

    - uses: dtolnay/rust-toolchain@stable

    - name: Setup Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git switch -c 'release-v${{ inputs.version }}'

    - name:  Get release version
      run: |
        message="${{ github.event.head_commit.message }}"
        version="$(echo "$message" | sed -zn "s/.*?publish_release \(v\S*\).*/\1/p; t; q1")"
        echo "RELEASE_VERSION=$version" >> $GITHUB_ENV

    - name: Publish to crates.io
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CRATESIO_TOKEN }}
      run: |
        cargo publish --workspace

    - name: Tag commit
      run: |
        git tag "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
        git push origin tag "$RELEASE_VERSION"

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.TOKEN }}
      run: |
        current_changelog="$(
          awk "/## ${RELEASE_VERSION}/{flag=1; next} /## /{flag=0} flag" \
            CHANGELOG.md
        )"
        gh release create $RELEASE_VERSION \
          --title "Release $RELEASE_VERSION"\
          --notes "$current_changelog" || true
